name: Update Strava Activities

on:
  schedule:
    - cron: '0 8 * * *' # Runs at 8:00 UTC every day
  workflow_dispatch:      # Allows manual trigger

jobs:
  update-strava:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Run Fetch Script
      env:
        STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
        STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
        STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
      run: node scripts/fetch_strava_recent.js
      
    - name: Commit and Push if changed
      run: |
        git config --global user.name 'StravaBot'
        git config --global user.email 'stravabot@users.noreply.github.com'
        git add data/recent_activities.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update strava activities" && git push)
